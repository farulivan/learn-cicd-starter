name: cd

on:
  push:
    branches: [main]
    
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      
      - name: Build
        run: scripts/buildprod.sh

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/21442777678/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@neural-vista-515411-n0.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build Docker image and push to Google Container Registry
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/neural-vista-515411-n0/notely-ar-repo/notely:latest .
